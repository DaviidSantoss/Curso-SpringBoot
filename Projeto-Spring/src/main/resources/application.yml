spring:
  application:
    name: Projeto-Spring

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/projeto_spring?useTimezone=true&serverTimezone=UTC
    username: root
    password: 12345

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  enable-hateoas: false
  paths-to-match: /books/**, /person/**
  swagger-ui:
    use-root-path: true
