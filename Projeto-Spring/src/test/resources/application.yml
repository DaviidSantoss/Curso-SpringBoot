server:
  port: 8888
cors:
  originPatterns: http://localhost:8080,http://localhost:3000,https://www.instagram.com/david.snt0s/

spring:
  application:
    name: Projeto-Spring

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
jpa:
  hibernate:
    ddl-auto: none
  properties:
    hibernate:
      format_sql: true
  show-sql: false
  open-in-view: false

  logging:
    level:
      root: INFO

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  enable-hateoas: false
  paths-to-match: /books/**, /person/**
  swagger-ui:
    use-root-path: true
